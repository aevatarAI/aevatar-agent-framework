name: vibe_goal_loop
description: "Bounded loop wrapper for vibe_researching (goal/loop mode)"

inputs:
  - name: session_id
    type: string
    required: true
    description: "Session id"
  - name: run_id
    type: string
    required: false
    description: "Run id (request id)"
    default: ""
  - name: question
    type: string
    required: true
    description: "User question / research task"
  - name: attachments
    type: object
    required: false
    description: "Attachment path list (optional)"
    default: []
  - name: max_iterations
    type: int
    default: 3
    description: "Hard cap for loop rounds"
  - name: state
    type: object
    required: false
    description: "Loop state (internal recursion)"
    default: {}

defaults:
  llm_call:
    max_length: 40000
    strict_parse: true
    timeout_seconds: 300
    idle_timeout_seconds: 120

steps:
  - id: ensure_state
    type: conditional
    condition: "{{ state.iteration != null }}"
    if_false:
      - id: init_state
        type: llm_call
        output: json
        prompt: |
          Return ONLY JSON (no markdown).
          Initialize loop state:
          {
            "iteration": 0,
            "max_iterations": {{ max_iterations }},
            "done": false,
            "status": "running"
          }
        store: state

  - id: run_vibe
    type: workflow_call
    workflow: vibe_researching
    params:
      session_id: "{{ session_id }}"
      run_id: "{{ run_id }}"
      question: "{{ question }}"
      attachments: "{{ attachments }}"
    store: round_result

  - id: update_state
    type: transform
    ops:
      - op: inc_path
        target: state
        path: iteration
        by: 1
      - op: set_path
        target: state
        path: last_result
        value: "{{ round_result }}"

  - id: stop_or_continue
    type: conditional
    condition: "{{ state.iteration >= state.max_iterations }}"
    if_false:
      - id: recurse
        type: workflow_call
        workflow: vibe_goal_loop
        params:
          session_id: "{{ session_id }}"
          run_id: "{{ run_id }}"
          question: "{{ question }}"
          attachments: "{{ attachments }}"
          max_iterations: "{{ max_iterations }}"
          state: "{{ state }}"
        store: recursive_output
      - id: unwrap_state
        type: assign
        from: "recursive_output.state"
        store: state

output:
  state: "{{ state }}"
  last_result: "{{ state.last_result }}"
