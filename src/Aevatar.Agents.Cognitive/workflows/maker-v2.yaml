# ============================================================
#  MAKER System v2 - DSL 重新实现
#  
#  论文: "Solving a Million-Step LLM Task with Zero Errors"
#  https://arxiv.org/html/2511.09030v1
#  
#  核心算法 (完整实现):
#  1. 分解任务 (Decomposition) - 将复杂任务分解为子任务
#  2. 并行生成提案 (Fan-out) - 多 Worker 并行 LLM
#  3. 投票共识 (Vote) - First-to-ahead-by-K 共识机制
#  4. Red-Flagging - 内容验证与恢复 (Section 3.3)
#  5. 递归处理 (Recursive) - 子任务递归执行
#  6. 合成结果 (Composition) - 聚合子任务结果
# ============================================================

name: maker-v2
version: "2.0"
description: "MAKER System - Distributed parallel LLM with consensus voting"

# ============================================================
#  输入参数
# ============================================================
inputs:
  - name: task
    type: string
    required: true
    description: "任务描述"
  
  - name: context
    type: object
    required: false
    description: "额外上下文信息"
  
  # 投票所需票数（默认 3，可覆盖）
  - name: k
    type: int
    default: 3
    description: "共识所需票数 (first-to-ahead-by-k)"
  
  # 投票最大轮数
  - name: max_rounds
    type: int
    default: 10
    description: "最大投票轮数"
  
  # 递归深度保护（硬锁，正常情况下不应触发）
  - name: max_depth
    type: int
    default: 50
    description: "最大递归深度硬限制（安全阀）"

# ============================================================
#  默认策略（可在步骤层覆盖）
# ============================================================
defaults:
  vote:
    k: 3                   # 共识票数默认值
    max_rounds: 10         # 最大轮次
    similarity: 0.85       # 仅在配置了 embedding 时生效
    red_flag:
      max_length: 102400   # 超长判红旗
      strict_parse: true   # 解析失败视为红旗
      max_red_flags: 20    # 红旗上限（可被 step 覆盖）
  llm_call:
    max_length: 102400     # 超长判红旗
    strict_parse: true     # 解析失败视为红旗
    # --------------------------------------------------------
    #  System prompt (shared) - use HPA as thinking foundation
    #
    #  NOTE:
    #  - 这是提示词层的“思考框架”，不引入任何 HPA 计算/原语
    # --------------------------------------------------------
    system: |
      You are an agent in a MAKER-style reasoning workflow (decompose → parallel propose → vote → compose).
      Treat the paper "Holographic Polar Arithmetic" (2025) as a reference model.

      Core triad (Rotation → Factorization → Projection):
      - Rotation (scan Θ): time = depth/iteration; use irrational rotation intuition (golden α=φ^{-1}) to diversify and avoid resonance.
      - Factorization: treat facts as generators; make dependencies explicit with citations like [O1,T3].
      - Projection/readout: accept only closed arguments; any missing lemma/assumption is a residual gap δ and must be stated explicitly.

      Paper-aligned discipline:
      - Embedding view: Z=ρ·exp(i·θ×) separates magnitude ρ from multiplicative phase θ× (do not conflate with scan time).
      - Minimal complexity: prefer short, checkable steps and minimal repairs (Zeckendorf/Ostrowski intuition).
      - Path dependence: reasoning order matters; prefer arguments robust to ordering (low fragility / low associator intuition).

      Fast-consensus mode:
      - Be decisive: pick one best option and give a short reason.
      - If blocked, state the minimal gap δ and propose the smallest repair.

      Hard constraints:
      - Do NOT invent facts.
      - Follow the requested output format exactly.
      - When JSON is required, output JSON only (no markdown, no commentary).
      - CRITICAL: The JSON output must be a SINGLE, COMPLETE object.
      - After outputting the final closing brace }, STOP generating immediately.
      - Do NOT continue thinking, do NOT add commentary, do NOT repeat fields.

# ============================================================
#  步骤定义
# ============================================================
steps:
  # --------------------------------------------------------
  #  Step 1: 判断任务是否为原子任务 (返回 JSON)
  # --------------------------------------------------------
  - id: check_atomic
    type: llm_call
    # 可覆盖默认 llm_call 限制
    max_length: 102400
    strict_parse: true
    prompt: |
      Analyze the following task and determine if it is ATOMIC or COMPLEX.
      
      ═══════════════════════════════════════════════════════════════
      DECISION CRITERIA:
      ═══════════════════════════════════════════════════════════════
      
      A task is **COMPLEX** (needs decomposition) if:
      - It involves multiple distinct aspects that should be evaluated separately
      - It's a comprehensive review/analysis requiring different expertise areas
      - Examples: Paper review (technical soundness, novelty, clarity, etc.)
      - Examples: Code review (security, performance, maintainability, etc.)
      - Examples: Business analysis (market, competition, risks, etc.)
      
      A task is **ATOMIC** (can be solved directly) if:
      - It focuses on ONE specific aspect or question
      - It's a simple query, calculation, or single-focus analysis
      - It's already a sub-task from a previous decomposition
      - Examples: "Evaluate the novelty of this approach"
      - Examples: "Check if the math proofs are correct"
      - Examples: "Summarize the related work section"
      
      ⚠️ IMPORTANT: Comprehensive reviews (paper review, code review, etc.) 
      should be COMPLEX and decomposed into focused sub-tasks for better quality.
      
      ═══════════════════════════════════════════════════════════════
      TASK TO ANALYZE:
      ═══════════════════════════════════════════════════════════════
      {{task}}
      {% if context %}
      
      ═══════════════════════════════════════════════════════════════
      CONTEXT:
      ═══════════════════════════════════════════════════════════════
      {{context | json}}
      {% endif %}
      
      
      ═══════════════════════════════════════════════════════════════
      RESPONSE FORMAT (JSON - output EXACTLY ONCE, no duplicates):
      ═══════════════════════════════════════════════════════════════
      {
        "is_atomic": true or false,
        "reasoning": "brief explanation"
      }
      
      
    output: json
    store: atomic_check

  # --------------------------------------------------------
  #  Step 2: 条件分支 - 原子任务直接解决，复杂任务分解
  # --------------------------------------------------------
  - id: process_task
    type: conditional
    condition: "{{atomic_check.is_atomic}}"
    
    # 原子任务：直接投票解决
    if_true:
      - id: solve_atomic
        type: vote
        # 可覆盖默认 vote 限制
        k: "{{k | default: 3}}"
        max_rounds: "{{max_rounds | default: 10}}"
        similarity: 0.85
        red_flag:
          strategy: english
          # NOTE:
          # - 1024 会导致“短但完整”的文本解答（尤其是 proof/argumentation）频繁触发 redflag-length
          # - 这里提高上限，仍由 defaults.llm_call/max_length + streaming 保护防止爆炸输出
          max_length: 102400
          strict_parse: true
          max_red_flags: 20
        generator:
          type: llm_call
          max_length: 102400
          strict_parse: true
          prompt: |
            Solve the following task directly:
            
            Task: {{task}}
            {% if context %}
            Context: {{context | json}}
            {% endif %}
            
            Provide a complete, well-reasoned solution.
          output: text
        store: atomic_solution
    
    # 复杂任务：分解 → 递归 → 合成
    if_false:
      # Step 2a: 投票决定分解方案
      - id: decompose
        type: vote
        k: "{{k | default: 3}}"
        max_rounds: "{{max_rounds | default: 10}}"
        similarity: 0.85
        red_flag:
          strategy: english
          # JSON array of 2-5 subtasks can exceed 1KB with rich context; keep it bounded but not brittle.
          max_length: 102400
          strict_parse: true
          max_red_flags: 20
        generator:
          type: llm_call
          max_length: 102400
          strict_parse: true
          prompt: |
            Break down the following complex task into 2-5 independent subtasks.
            
            Task: {{task}}
            {% if context %}
            Context: {{context | json}}
            {% endif %}
            
            Format your response as a JSON array:
            [
              {"id": "subtask_1", "description": "..."},
              {"id": "subtask_2", "description": "..."}
            ]
          output: json_array
        store: subtasks
      
      # Step 2b: 并行递归执行子任务 (真正的 Actor 并行)
      - id: execute_subtasks
        type: fan_out
        for_each: subtasks
        max_concurrency: 5
        step:
          type: workflow_call
          workflow: maker-v2
          params:
            task: "{{item.description}}"
            context: "{{context}}"
            k: "{{k}}"
            max_depth: "{{max_depth}}"
        reduce: collect
        store: subtask_results
      
      # Step 2c: 投票合成最终结果
      - id: compose
        type: vote
        k: "{{k | default: 3}}"
        max_rounds: "{{max_rounds | default: 10}}"
        similarity: 0.85
        red_flag:
          strategy: english
          # Final composed solution is often >1KB; raise cap to avoid redflag-length for normal outputs.
          max_length: 102400
          strict_parse: true
          max_red_flags: 20
        generator:
          type: llm_call
          max_length: 102400
          strict_parse: true
          prompt: |
            Compose the following subtask solutions into a coherent final solution.
            
            Original Task: {{task}}
            
            Subtask Results:
            {% for result in subtask_results %}
            - {{result.solution}}
            {% endfor %}
            
            Synthesize a comprehensive solution that addresses the original task.
          output: text
        store: composed_solution

# ============================================================
#  输出定义
# ============================================================
output:
  solution: "{{atomic_solution | default: composed_solution}}"
  is_atomic: "{{atomic_check.is_atomic | default: false}}"
  subtask_count: "{{subtasks | size | default: 0}}"

