dsl_version: "0.1"
goal:
  name: "vibe default pipeline (template)"
strategy: "cot"
budget:
  max_steps: 30
  token_limit: 20000
nodes:
  - id: planner
    type: planner
  - id: reasoner
    type: reasoner
  - id: librarian
    type: librarian
  - id: verifier
    type: verifier
  - id: dag_builder
    type: dag_builder
edges:
  # ----------------------------
  # Knowledge flow (compatible with the legacy hardcoded order):
  #   planner -> reasoner -> librarian
  #   reasoner -> verifier
  #   librarian + verifier -> dag_builder
  # ----------------------------
  - from: planner
    to: reasoner
    channel: upstream_output
  - from: reasoner
    to: librarian
    channel: upstream_output
  - from: reasoner
    to: verifier
    channel: upstream_output
  - from: librarian
    to: dag_builder
    channel: upstream_output
  - from: verifier
    to: dag_builder
    channel: upstream_output

  # ----------------------------
  # Context bindings (mesh advantage):
  # Make inputs explicit, bounded, and inspectable per node.
  # ----------------------------

  # Provide DAG snapshot context without introducing a cycle.
  - from: planner
    to: reasoner
    channel: dag_snapshot
  - from: planner
    to: librarian
    channel: dag_snapshot
  - from: planner
    to: verifier
    channel: dag_snapshot
  # Provide DAG snapshot context without introducing a cycle.
  - from: planner
    to: dag_builder
    channel: dag_snapshot

  # Provide planner output excerpt as a shared "plan" context.
  - from: planner
    to: reasoner
    channel: planner_output
  - from: planner
    to: librarian
    channel: planner_output
  - from: planner
    to: verifier
    channel: planner_output
  - from: planner
    to: dag_builder
    channel: planner_output
constraints: []


