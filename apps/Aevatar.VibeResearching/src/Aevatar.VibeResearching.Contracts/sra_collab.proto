syntax = "proto3";

package VibeResearching.Collab;

option csharp_namespace = "VibeResearching.Contracts.Collab";

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";

// ============================================================
//  SRA Paper Collaboration Contracts (File-SSoT)
//
//  Goals:
//  - File-only agent communication via mailbox (durable, auditable).
//  - Facts lifecycle: facts_proposed -> votes/verifications -> final -> DAG.
//  - Markdown paper collaboration via patch proposals (single writer applies).
//
//  Notes:
//  - Keep payloads small; large blobs should be referenced via file paths.
//  - Schema-first: all cross-agent boundary types must be Protobuf.
// ============================================================

message SraMailboxMessage {
  // Session scope (workspace/sessions/{sessionId}).
  string session_id = 1;

  // Unique message id (session-scoped is acceptable if deterministic).
  string message_id = 2;

  // Agent identity (e.g., "paper_editor", "reviewer_1").
  string from_agent = 3;
  string to_agent = 4;

  // Human-friendly message kind for routing (e.g., "fact.proposal", "paper.patch").
  // This is redundant with Any.type_url but helps routing without unpacking.
  string type = 5;

  // Correlation id for tracing a workflow across agents/messages.
  string correlation_id = 6;

  google.protobuf.Timestamp created_at = 7;

  // Typed payload.
  google.protobuf.Any payload = 8;

  // Lightweight labels for filtering/indexing.
  map<string, string> labels = 100;
}

// ============================================================
//  Facts
// ============================================================

message FactProposal {
  string session_id = 1;
  string fact_id = 2; // stable id (used for filenames)
  string title = 3;

  // Human-readable content (Markdown allowed).
  string content = 4;

  // Evidence can point to:
  // - workspace/sessions/{sessionId}/artifacts/*
  // - external references (URLs or identifiers)
  repeated string evidence_paths = 5;

  google.protobuf.Timestamp created_at = 6;
  string proposed_by = 7;

  map<string, string> tags = 100;
}

enum FactVoteValue {
  FACT_VOTE_VALUE_UNSPECIFIED = 0;
  FACT_VOTE_VALUE_APPROVE = 1;
  FACT_VOTE_VALUE_REJECT = 2;
  FACT_VOTE_VALUE_NEEDS_WORK = 3;
}

message FactVote {
  string session_id = 1;
  string fact_id = 2;
  string reviewer_id = 3;
  FactVoteValue vote = 4;
  string comment = 5;
  google.protobuf.Timestamp created_at = 6;
}

message FactVerification {
  string session_id = 1;
  string fact_id = 2;
  string verifier_id = 3;

  // e.g., "python_exec"
  string tool = 4;

  bool result = 5;

  // Artifacts produced during verification (under workspace artifacts).
  repeated string artifact_paths = 6;

  // Small, human-readable excerpt for quick review (bounded by implementation).
  string log_excerpt = 7;

  google.protobuf.Timestamp created_at = 8;
}

enum FactDecisionValue {
  FACT_DECISION_VALUE_UNSPECIFIED = 0;
  FACT_DECISION_VALUE_PROMOTE = 1;
  FACT_DECISION_VALUE_REJECT = 2;
}

message FactDecision {
  string session_id = 1;
  string fact_id = 2;
  FactDecisionValue decision = 3;

  // "votes", "verification", "mixed"
  string basis = 4;

  // Optional rationale for humans (bounded).
  string rationale = 5;

  google.protobuf.Timestamp finalized_at = 6;
  string finalized_by = 7;
}

// ============================================================
//  Paper (Markdown) - Patch Proposals
// ============================================================

enum PaperTargetFile {
  PAPER_TARGET_FILE_UNSPECIFIED = 0;
  PAPER_TARGET_FILE_OUTLINE = 1;
  PAPER_TARGET_FILE_DRAFT = 2;
}

enum PaperPatchFormat {
  PAPER_PATCH_FORMAT_UNSPECIFIED = 0;
  // Deterministic "replace span" patch (MVP recommended).
  PAPER_PATCH_FORMAT_REPLACE_SPAN = 1;
  // Standard unified diff; may be supported later.
  PAPER_PATCH_FORMAT_UNIFIED_DIFF = 2;
}

message PaperPatchProposal {
  string session_id = 1;
  string patch_id = 2; // stable id
  string author_agent = 3;

  PaperTargetFile target_file = 4;
  PaperPatchFormat format = 5;

  // Patch payload; keep it reasonably small (implementation-enforced).
  string patch_text = 6;

  // ------------------------------------------------------------
  //  Replace-span patch (format = PAPER_PATCH_FORMAT_REPLACE_SPAN)
  //
  //  - 1-based line numbers (human friendly).
  //  - Replace lines [start_line, end_line_exclusive) with replace_text.
  // ------------------------------------------------------------
  int32 replace_start_line = 20;
  int32 replace_end_line_exclusive = 21;
  string replace_text = 22;

  string correlation_id = 7;
  google.protobuf.Timestamp created_at = 8;
}

// ============================================================
//  Vibe Researching (single entrypoint + multi-agent bus)
//
//  Notes:
//  - These messages are designed for mailbox + file-based artifacts.
//  - Keep payloads small; large texts should be referenced by file paths.
// ============================================================

// ------------------------------------------------------------
//  Goals (File-SSoT under workspace/sessions/{id}/decisions/)
// ------------------------------------------------------------

message SraGoalItem {
  string goal_id = 1;         // stable id within session
  string text = 2;            // human goal statement (Markdown allowed)
  int32 priority = 3;         // lower = higher priority; 0 is default
  google.protobuf.Timestamp updated_at = 4;
}

message SraGoalsSnapshot {
  string session_id = 1;
  int32 version = 2;          // monotonically increasing (writer-managed)
  repeated SraGoalItem goals = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message SraGoalsUpdated {
  string session_id = 1;
  SraGoalsSnapshot snapshot = 2;
  string reason = 3;          // e.g. "user_edit", "import", "system"
  string updated_by = 4;      // e.g. "user", "research_assistant"
  google.protobuf.Timestamp created_at = 5;
}

// ------------------------------------------------------------
//  Agent communication (single visible chat + routed workers)
// ------------------------------------------------------------

message SraAgentUserMessage {
  string session_id = 1;
  string message_id = 2;              // stable-ish id for correlation
  string text = 3;                    // user text (Markdown allowed)
  repeated string attachment_paths = 4; // relative paths under session workspace
  string to_agents = 5;               // routing hint: "*" or comma-separated agents (MVP)
  google.protobuf.Timestamp created_at = 6;
}

message SraAgentTask {
  string session_id = 1;
  string task_id = 2;
  string title = 3;
  string detail = 4;
  repeated string related_goal_ids = 5;
  map<string, string> hints = 100;    // bounded metadata (e.g. "stage"="plan")
}

message SraAgentStatus {
  string session_id = 1;
  string agent = 2;                   // agent name (e.g., "planner")
  string state = 3;                   // e.g., "idle", "running", "blocked", "error"
  string current = 4;                 // short description (bounded)
  google.protobuf.Timestamp updated_at = 5;
  map<string, string> metrics = 100;  // small counters (e.g., "tokens"="1234")
}

// ------------------------------------------------------------
//  DAG (file-based knowledge library, consensus gated)
// ------------------------------------------------------------

enum SraDagNodeType {
  SRA_DAG_NODE_TYPE_UNSPECIFIED = 0;
  SRA_DAG_NODE_TYPE_AXIOM = 1;
  SRA_DAG_NODE_TYPE_THEOREM = 2;
  SRA_DAG_NODE_TYPE_ASSUMPTION = 3;
  SRA_DAG_NODE_TYPE_HYPOTHESIS = 4;
  SRA_DAG_NODE_TYPE_UNKNOWN = 5;
}

enum SraDagNodeKind {
  // Default to "knowledge" for backwards compatibility (old snapshots had no kind).
  SRA_DAG_NODE_KIND_KNOWLEDGE = 0;
  SRA_DAG_NODE_KIND_PLAN = 1;
}

message SraDagAttestation {
  string pubkey = 1;                  // recommended: hex/base64
  string signature = 2;               // recommended: base64
}

message SraDagNode {
  string id = 1;
  SraDagNodeType type = 2;
  string label = 3;                   // short statement
  string proof = 4;                   // bounded; long proofs should be file refs
  google.protobuf.Timestamp updated_at = 5;
  SraDagNodeKind kind = 6;            // knowledge vs plan (for grounding / filtering)
  string owner = 7;                   // optional: owner public key (hex/base64)
  repeated SraDagAttestation attestations = 8; // verifier signatures / confirmations
  string session_id = 9;              // source session ID (for cross-session rendering)
  map<string, string> tags = 100;     // optional lightweight labels
}

message SraDagEdge {
  string from_id = 1;
  string to_id = 2;
  string type = 3;                    // default: "depends_on"
  google.protobuf.Timestamp updated_at = 4;
}

message SraDagMutation {
  string session_id = 1;
  string mutation_id = 2;             // stable id for dedupe
  string author_agent = 3;            // e.g., "dag_builder"
  repeated SraDagNode upsert_nodes = 4;
  repeated SraDagEdge upsert_edges = 5;
  google.protobuf.Timestamp created_at = 6;
  map<string, string> labels = 100;   // e.g., "workflow"="verifier-quorum" | "maker-v2"
}

message SraDagSnapshot {
  string session_id = 1;
  repeated SraDagNode nodes = 2;
  repeated SraDagEdge edges = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message SraDagExplain {
  string session_id = 1;
  string node_id = 2;
  SraDagNode node = 3;                // may be empty if not found
  repeated string direct_deps = 4;    // direct dependencies (ids)
  repeated string topo = 5;           // dependency closure topo order
  bool has_cycle = 6;
  bool provable = 7;                  // no cycle and no missing deps (heuristic)
  repeated SraDagNode missing = 8;    // missing deps as nodes (bounded)
}

// ------------------------------------------------------------
//  Derivation Trace (per-round summary)
// ------------------------------------------------------------

message SraRoundAgentSummary {
  string agent = 1;                   // e.g., "reasoner"
  repeated string highlights = 2;     // bounded bullet points
  repeated string next_actions = 3;   // bounded bullet points
  repeated string referenced_paths = 4; // files referenced/produced this round
}

message SraRoundDagChange {
  string node_id = 1;
  SraDagNodeType node_type = 2;
  string change = 3;                 // "added" | "updated" | "staged"
}

message SraRoundSummary {
  string session_id = 1;
  string run_id = 2;
  int32 round_index = 3;
  string trigger_kind = 4;           // "goal_update" | "user_message" | "tick" | "manual"
  string trigger_ref = 5;            // e.g., message_id / goal_version (bounded)
  repeated SraRoundAgentSummary per_agent = 6;
  repeated SraRoundDagChange dag_changes = 7;
  repeated string open_questions = 8;  // bounded
  repeated string missing_evidence = 9; // bounded (file paths or material ids)
  google.protobuf.Timestamp updated_at = 10;
  map<string, string> metrics = 100;   // e.g., "llm_calls"="12"
}

// ------------------------------------------------------------
//  Research Brief (1-page) - issue #67 alignment
// ------------------------------------------------------------

message SraResearchTerm {
  string term = 1;
  string meaning = 2; // bounded
}

message SraResearchMilestone {
  // Suggested round index (1-based). 0 means "unspecified".
  int32 round_index = 1;
  string expected_output = 2; // bounded
}

message SraResearchBriefSnapshot {
  string session_id = 1;
  int32 version = 2; // monotonically increasing (writer-managed)

  // "Rewrite the question into an executable research problem"
  string rewritten_question = 3; // bounded
  string scope = 4;              // bounded (include boundaries)
  string success_criteria = 5;   // bounded

  repeated SraResearchTerm terms = 6;      // key terms and definitions
  repeated string assumptions = 7;         // bounded bullets
  repeated string risks = 8;               // bounded bullets
  repeated string uncertainties = 9;       // bounded bullets
  repeated SraResearchMilestone milestones = 10;

  google.protobuf.Timestamp updated_at = 11;
  map<string, string> labels = 100;
}

// ------------------------------------------------------------
//  Compute (programmatic verification/experiment) - issue #67 alignment
// ------------------------------------------------------------

enum SraComputeCostLevel {
  SRA_COMPUTE_COST_LEVEL_UNSPECIFIED = 0;
  SRA_COMPUTE_COST_LEVEL_LOW = 1;
  SRA_COMPUTE_COST_LEVEL_MEDIUM = 2;
  SRA_COMPUTE_COST_LEVEL_HIGH = 3;
}

enum SraComputeRiskLevel {
  SRA_COMPUTE_RISK_LEVEL_UNSPECIFIED = 0;
  SRA_COMPUTE_RISK_LEVEL_LOW = 1;
  SRA_COMPUTE_RISK_LEVEL_MEDIUM = 2;
  SRA_COMPUTE_RISK_LEVEL_HIGH = 3;
}

enum SraComputeAction {
  SRA_COMPUTE_ACTION_UNSPECIFIED = 0;
  SRA_COMPUTE_ACTION_EXECUTE = 1;
  SRA_COMPUTE_ACTION_DEGRADE = 2;
  SRA_COMPUTE_ACTION_SKIP = 3;
}

enum SraComputeJobState {
  SRA_COMPUTE_JOB_STATE_UNSPECIFIED = 0;
  SRA_COMPUTE_JOB_STATE_QUEUED = 1;
  SRA_COMPUTE_JOB_STATE_RUNNING = 2;
  SRA_COMPUTE_JOB_STATE_SUCCEEDED = 3;
  SRA_COMPUTE_JOB_STATE_FAILED = 4;
  SRA_COMPUTE_JOB_STATE_CANCELLED = 5;
}

message SraComputeRequest {
  string session_id = 1;
  string request_id = 2;         // stable id for correlation/dedupe
  string requested_by = 3;       // e.g., "verifier"

  // Human-facing explanation
  string why_required = 4;       // bounded
  string what_to_compute = 5;    // bounded
  repeated string expected_outputs = 6; // bounded bullets

  SraComputeCostLevel cost = 7;
  SraComputeRiskLevel risk = 8;

  // Provide 1-3 fallback paths (bounded), e.g. "degrade to heuristic check"
  repeated string fallback_options = 9;

  google.protobuf.Timestamp created_at = 10;
  map<string, string> labels = 100;
}

message SraComputePlan {
  string session_id = 1;
  string plan_id = 2;            // stable id
  string request_id = 3;

  // Recommendation and whether user confirmation is required.
  SraComputeAction recommended_action = 4;
  bool requires_user_confirmation = 5;

  // Human-facing execution plan card (bounded)
  string plan_summary = 6;
  repeated string risk_notes = 7;
  repeated string failure_fallbacks = 8;

  // Where artifacts will be written (relative to session workspace).
  string artifacts_dir = 9;

  google.protobuf.Timestamp created_at = 10;
  map<string, string> labels = 100;
}

message SraComputeJobStatus {
  string session_id = 1;
  string job_id = 2;
  string plan_id = 3;
  string request_id = 4;

  SraComputeJobState state = 5;
  int32 progress_pct = 6;        // 0..100 (best-effort)
  string status = 7;             // bounded one-liner

  // Bounded rolling excerpt for UI; full logs are file refs.
  string log_excerpt = 8;
  repeated string artifact_paths = 9; // relative paths under workspace

  string error = 10;             // bounded

  google.protobuf.Timestamp started_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  google.protobuf.Timestamp finished_at = 13;

  map<string, string> labels = 100;
}

// ------------------------------------------------------------
//  Delivery Center (paper + lists) - issue #67 alignment
// ------------------------------------------------------------

enum SraConfidenceLevel {
  SRA_CONFIDENCE_LEVEL_UNSPECIFIED = 0;
  SRA_CONFIDENCE_LEVEL_LOW = 1;
  SRA_CONFIDENCE_LEVEL_MEDIUM = 2;
  SRA_CONFIDENCE_LEVEL_HIGH = 3;
}

message SraConclusionCard {
  string card_id = 1;
  string claim = 2;              // bounded
  SraConfidenceLevel confidence = 3;
  repeated string evidence_paths = 4;        // file refs (workspace artifacts or external refs)
  repeated string counter_evidence_paths = 5;
  repeated string related_dag_node_ids = 6;
  string notes = 7;              // bounded
  google.protobuf.Timestamp updated_at = 8;
  map<string, string> tags = 100;
}

message SraEvidenceItem {
  string evidence_id = 1;
  string title = 2;              // bounded
  string path = 3;               // file ref (workspace artifacts or external refs)
  string excerpt = 4;            // bounded quote/snippet
  string relevance = 5;          // bounded
  google.protobuf.Timestamp updated_at = 6;
  map<string, string> tags = 100;
}

message SraNextTaskItem {
  string task_id = 1;
  string title = 2;              // bounded
  string detail = 3;             // bounded
  int32 priority = 4;            // lower = higher priority
  repeated string blocked_by = 5; // bounded ids/paths
  google.protobuf.Timestamp updated_at = 6;
  map<string, string> tags = 100;
}

message SraConclusionCardsSnapshot {
  string session_id = 1;
  int32 version = 2;
  repeated SraConclusionCard items = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message SraEvidenceTableSnapshot {
  string session_id = 1;
  int32 version = 2;
  repeated SraEvidenceItem items = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message SraNextTasksSnapshot {
  string session_id = 1;
  int32 version = 2;
  repeated SraNextTaskItem items = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message SraDeliveryCenterSnapshot {
  string session_id = 1;
  int32 version = 2;

  // Canonical files (relative to session workspace root)
  string paper_outline_path = 3;
  string paper_draft_path = 4;

  string conclusions_path = 5;
  string evidence_path = 6;
  string tasks_path = 7;

  // Human-friendly summary of what's new/changed this round (bounded).
  string changed_summary = 8;

  google.protobuf.Timestamp updated_at = 9;
  map<string, string> labels = 100;
}


