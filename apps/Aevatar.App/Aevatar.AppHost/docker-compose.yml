# =========================================================================
#  Aevatar Platform Infrastructure
# =========================================================================
#  Usage:
#    docker-compose up -d        # Start all services
#    docker-compose down         # Stop all services
#    docker-compose logs -f      # View logs
# =========================================================================

services:
  # -------------------------------------------------------------------------
  # MongoDB - State Persistence
  # -------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: aevatar-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: AevatarBusiness
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aevatar-network

  # -------------------------------------------------------------------------
  # Redis - Distributed Caching
  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: aevatar-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aevatar-network

  # -------------------------------------------------------------------------
  # Zookeeper - Kafka Coordination
  # -------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: aevatar-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aevatar-network

  # -------------------------------------------------------------------------
  # Kafka - Event Streaming
  # -------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: aevatar-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "29092:29092"
      - "19092:19092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:19092"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - aevatar-network

  # -------------------------------------------------------------------------
  # Kafka UI - Monitoring (Optional)
  # -------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: aevatar-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8082:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: aevatar
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - aevatar-network

volumes:
  mongodb_data:
    name: aevatar-mongodb-data
  redis_data:
    name: aevatar-redis-data

networks:
  aevatar-network:
    name: aevatar-network

