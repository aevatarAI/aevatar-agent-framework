syntax = "proto3";

package Aevatar.Agents.AI;

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

// =====================================================
// AI Agent State
// =====================================================

message AevatarAIAgentState {
  repeated AevatarChatMessage history = 1;
  map<string, string> context = 2;
  int64 total_token_used = 3;
  google.protobuf.Timestamp last_activity = 4;
  google.protobuf.Any custom_state = 100;
}

message AevatarChatMessage {
  string id = 1;
  AevatarChatRole role = 2;
  string content = 3;
  repeated ToolCall tool_calls = 4;
  ToolExecutionResult tool_result = 5;
  google.protobuf.Timestamp timestamp = 6;
  int32 token_used = 7;
  map<string, string> metadata = 8;
  // Image keys for multimodal messages (references to blob storage)
  repeated string image_keys = 9;
}

// =====================================================
// Multi-Modal Content Types
// =====================================================

// Image content for multimodal AI requests
message AevatarImageContent {
  string key = 1;           // Blob storage key
  string url = 2;           // Optional: direct URL
  bytes data = 3;           // Optional: raw image bytes
  string media_type = 4;    // MIME type (image/jpeg, image/png, etc.)
  string description = 5;   // Optional: image description/alt text
}

message ToolCall {
  string id = 1;
  string tool_name = 2;
  string arguments = 3;
  string type = 4;
}

message ToolExecutionResult {
  string tool_call_id = 1;
  string tool_name = 2;
  string content = 3;
  bool is_success = 4;
  string error_message = 5;
  google.protobuf.Timestamp timestamp = 6;
  google.protobuf.Duration duration = 7;
}

// =====================================================
// AI Agent Config
// =====================================================

message AevatarAIAgentConfig {
  // --- 1. Core Persona (The Soul) ---
  string system_prompt = 1;

  // --- 2. Model Selection ---
  // If empty, use global default configuration
  optional string model = 2; 
  
  // --- 3. Core Inference Parameters (MEAI Compatible) ---
  // Use optional to support "inherit default if not set" logic
  
  // Control randomness (0.0 - 2.0)
  optional float temperature = 3; 
  
  // Nucleus sampling (0.0 - 1.0)
  optional float top_p = 4; 
  
  // Maximum output length
  optional int32 max_output_tokens = 5; 
  
  // Presence penalty (-2.0 - 2.0)
  optional float presence_penalty = 6; 
  
  // Frequency penalty (-2.0 - 2.0)
  optional float frequency_penalty = 7;
  
  // Stop sequences
  repeated string stop_sequences = 8;
  
  // Random seed (for reproducibility)
  optional int64 seed = 9;

  // --- 4. Advanced Behavior Control ---
  
  // Whether to allow parallel tool calls (Default: true)
  // MEAI: AllowMultipleToolCalls
  optional bool allow_multiple_tool_calls = 10; 

  // Response format: "text" or "json_object"
  // MEAI: ResponseFormat
  optional string response_format = 11;

  // --- 5. Business Extension ---
  google.protobuf.Any custom_config = 100;
}

// =====================================================
// Core AI Types and Enums
// =====================================================

enum AevatarChatRole {
  UNSPECIFIED = 0;
  SYSTEM = 1;
  USER = 2;
  ASSISTANT = 3;
  TOOL = 4;
}

// =====================================================
// AI Agent Configuration (Framework Level)
// =====================================================

// AI Agent framework configuration (contains AI behavior-related configuration)
message AevatarAIAgentConfiguration {
  string model = 1;                      // Model name
  double temperature = 2;                // Temperature parameter
  int32 max_tokens = 3;                  // Maximum token count
  int32 max_history = 4;                 // Maximum conversation history length
  double top_p = 5;                      // Top-p sampling
  double frequency_penalty = 6;          // Frequency penalty
  double presence_penalty = 7;           // Presence penalty
}

// =====================================================
// Chat and Conversation Messages
// =====================================================

message ConversationSummary {
  string content = 1;
  repeated string key_points = 2;
  repeated string topics = 3;
  string sentiment = 4;
}

// =====================================================
// Processing Messages
// =====================================================

// Token usage
message AevatarTokenUsage {
  int32 prompt_tokens = 1;
  int32 completion_tokens = 2;
  int32 total_tokens = 3;
  double estimated_cost = 4;
}

// =====================================================
// Chat Request/Response Messages
// =====================================================

// Chat request
message ChatRequest {
  string message = 1;
  map<string, string> context = 2;
  string request_id = 3;
  int32 max_tokens = 4;
  double temperature = 5;
  repeated string stop_sequences = 6;
  string stage_hint = 7;
  // Image keys for multimodal input (references to blob storage)
  repeated string image_keys = 8;
  // External chat history for multi-turn conversations
  repeated AevatarChatMessage history = 9;
}

// Chat response
message ChatResponse {
  string content = 1;
  AevatarTokenUsage usage = 2;
  repeated ProcessingStep processing_steps = 3;
  string request_id = 4;
  bool tool_called = 5;
  ToolCallInfo tool_call = 6;
}

// Tool call information
message ToolCallInfo {
  string tool_name = 1;
  map<string, string> arguments = 2;
  string result = 3;
}

// Processing step (moved from AI.Core)
message ProcessingStep {
  ProcessingStepType type = 1;
  string description = 2;
  google.protobuf.Timestamp timestamp = 3;
  string result = 4;
  map<string, string> metadata = 5;
}

// Processing step type
enum ProcessingStepType {
  PROCESSING_STEP_TYPE_UNSPECIFIED = 0;
  PROCESSING_STEP_TYPE_PREPARATION = 1;
  PROCESSING_STEP_TYPE_LLM_GENERATION = 2;
  PROCESSING_STEP_TYPE_TOOL_EXECUTION = 3;
  PROCESSING_STEP_TYPE_REASONING = 4;
  PROCESSING_STEP_TYPE_ACTION = 5;
  PROCESSING_STEP_TYPE_OBSERVATION = 6;
  PROCESSING_STEP_TYPE_STRATEGY_SELECTION = 7;
}

// =====================================================
// AI Context Messages
// =====================================================

// AI processing context
message AevatarAIContext {
  string agent_id = 1;
  string question = 2;
  string system_prompt = 3;
  google.protobuf.Any working_memory = 4;
  google.protobuf.Any agent_state = 5;
  repeated AevatarConversationEntry conversation_history = 6;
  map<string, string> metadata = 7;
}

// Conversation entry
message AevatarConversationEntry {
  string role = 1;
  string content = 2;
  google.protobuf.Timestamp timestamp = 3;
}