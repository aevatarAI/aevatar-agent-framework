syntax = "proto3";
package Aevatar.Agents;

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";

// ============================================================
// Context Value for type-safe context propagation
// ============================================================

// Type-safe context value using oneof for extensibility.
// New types can be added without breaking compatibility.
message ContextValue {
  oneof value {
    string string_value = 1;
    bool bool_value = 2;
    int64 int_value = 3;
    double double_value = 4;
    string datetime_iso = 5;    // ISO8601 format string
    string guid_string = 6;     // Standard GUID format
    // Reserved for future expansion:
    // float float_value = 7;
    // bytes bytes_value = 8;
    // string decimal_string = 9;
    // int32 enum_value = 10;
  }
}

// Event propagation direction
enum EventDirection {
  EVENT_DIRECTION_UNSPECIFIED = 0;

  // Downward: Parent sends to its own stream, automatically broadcasts to all children
  EVENT_DIRECTION_DOWN = 1;

  // Upward: Child sends to parent's stream, automatically broadcasts to all siblings (including self)
  EVENT_DIRECTION_UP = 2;

  // Bidirectional: Send both upward and downward simultaneously
  EVENT_DIRECTION_BOTH = 3;

  // Self: Event is delivered directly to self, bypassing stream broadcast.
  // Used for triggering self-handling event handlers (e.g., ChatRequestEvent).
  EVENT_DIRECTION_SELF = 4;
}

message MessageEnvelope {
  string id = 1;
  google.protobuf.Timestamp timestamp = 2;
  google.protobuf.Any payload = 3;  // Parsed by business Agent
}

message EventEnvelope {
  // Basic fields.
  string id = 1;
  google.protobuf.Timestamp timestamp = 2;
  int64 version = 3;
  google.protobuf.Any payload = 4;

  // Propagation control fields.
  string correlation_id = 5;
  string publisher_id = 6;
  EventDirection direction = 7;
  bool should_stop_propagation = 8;
  int32 max_hop_count = 9;
  int32 current_hop_count = 10;
  int32 min_hop_count = 11;
  string message = 12;
  repeated string publishers = 13;

  // Point-to-point communication fields.
  // Target agent ID for P2P (only set when using SendToAsync)
  string target_agent_id = 14;
  
  // Propagation direction after P2P message arrives at target:
  // - Unspecified: Pure P2P, only target processes
  // - Down/Up/Both: Target processes then continues propagation in this direction
  EventDirection on_arrival_direction = 15;

  // Context metadata for request-scoped data propagation.
  // Type-safe key-value pairs from IAgentContext.
  // Uses ContextValue oneof for extensibility and cross-language support.
  map<string, ContextValue> context_metadata = 16;
}

message SubAgentAdded {
  string sub_agent_id = 1;
}

message SubAgentRemoved {
  string sub_agent_id = 1;
}

message LLMEvent {
  string prompt = 1;
  string response = 2;
}

message GeneralConfigEvent {
  string config_key = 1;
  string config_value = 2;
}

message CodeValidationEvent {
  string code = 1;
  bool result = 2;
}

message LLMAgentState {
  repeated string sub_agent_ids = 1;
  int64 current_version = 2;
  string llm_config = 3;
}

message CodingAgentState {
  repeated string sub_agent_ids = 1;
  int64 current_version = 2;
  string validation_history = 3;
}

// Exception event
message EventHandlerExceptionEvent {
  string agent_id = 1;
  string event_id = 2;
  string handler_name = 3;
  string event_type = 4;
  string exception_message = 5;
  string stack_trace = 6;
  google.protobuf.Timestamp timestamp = 7;
}

message GAgentBaseExceptionEvent {
  string agent_id = 1;
  string operation = 2;
  string exception_message = 3;
  string stack_trace = 4;
  google.protobuf.Timestamp timestamp = 5;
}

// ============================================================
// EventSourcing Messages
// ============================================================

// Agent State Event - EventSourcing core message
// Used for persisting and replaying Agent state changes
message AgentStateEvent {
  // Basic fields
  string event_id = 1;
  google.protobuf.Timestamp timestamp = 2;
  int64 version = 3;
  string event_type = 4;  // Event type (fully qualified name)

  // Event data (uses Any to support arbitrary Protobuf messages)
  google.protobuf.Any event_data = 5;

  // Metadata
  string agent_id = 6;
  string correlation_id = 7;
  map<string, string> metadata = 8;
}

// Agent Snapshot - Snapshot message
// Used to optimize event replay performance
message AgentSnapshot {
  int64 version = 1;
  google.protobuf.Timestamp timestamp = 2;

  // Snapshot state data (uses Any to support arbitrary state types)
  google.protobuf.Any state_data = 3;

  map<string, string> metadata = 4;
}

// ============================================================
// Framework-level State Change Events
// ============================================================

// Parent changed event
message ParentChangedEvent {
  string old_parent = 1;
  string new_parent = 2;
}

// Child added event  
message ChildAddedEvent {
  string child_id = 1;
}

// Child removed event
message ChildRemovedEvent {
  string child_id = 1;
}

// Custom state changed event (wrapper)
message CustomStateChangedEvent {
  string description = 1;
  google.protobuf.Any state_data = 2;
}

// Agent initialized event
message AgentInitializedEvent {
  string agent_id = 1;
  string agent_type = 2;
  google.protobuf.Any initial_state = 3;
}

// ============================================================
// Interruptible Runs (cross-boundary control)
//
// 中文说明：
// - 用于“可打断”的 run 控制信号（取消/被新 run 替换）。
// - 该消息是跨边界（stream/actor/rpc）控制面，必须保持 Protobuf-first。
// - 推荐在 EventEnvelope.context_metadata 里携带以下键（可选）：
//   - "run_id": 当前执行链路的 runId（字符串）
//   - "run_scope_id": run 作用域（sessionId/agentId 等）
// ============================================================

enum RunControlAction {
  RUN_CONTROL_ACTION_UNSPECIFIED = 0;
  RUN_CONTROL_ACTION_CANCEL = 1;     // cancel target_run_id
  RUN_CONTROL_ACTION_SUPERSEDE = 2;  // cancel target_run_id, superseded_by_run_id set
}

message RunControlEvent {
  string scope_id = 1;               // sessionId/agentId (best-effort, for routing/observability)
  string target_run_id = 2;          // the run to cancel/supersede
  string superseded_by_run_id = 3;   // optional: the new run that replaced it
  RunControlAction action = 4;
  string reason = 5;                // bounded; user/system reason
  google.protobuf.Timestamp timestamp = 6;
}

// ============================================================
// CQRS State Projection Messages
// ============================================================

// State wrapper for CQRS projection
// Used to wrap state data for streaming to external systems
message StateWrapper {
  // Agent identifier
  string agent_id = 1;
  
  // Agent type (full name)
  string agent_type = 2;
  
  // State data (wrapped in Any for flexibility)
  google.protobuf.Any state_data = 3;
  
  // Version number for optimistic concurrency
  int64 version = 4;
  
  // Timestamp when published
  google.protobuf.Timestamp published_at = 5;
  
  // Optional metadata
  map<string, string> metadata = 6;
}