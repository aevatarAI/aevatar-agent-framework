# ============================================================
#  HYPOTHESIS PROMOTION LOOP (HPL) + HPA
#
#  Adds Holographic Polar Arithmetic (HPA) as a deterministic evidence layer:
#   Rotation (scan Θ) → Factorization (depends_on/factor_sequence) → Projection (gap δ)
#
#  What changes vs hypothesis_promotion_loop.yaml:
#  - Coordinator/Workers must output depends_on + factor_sequence (for embedding + associator).
#  - Token-free hpa steps compute: scan_target, embeddings, coherence/gap, associator stats.
#  - Verification gate uses both vote-style counts and HPA metrics.
# ============================================================

name: hypothesis_promotion_loop_hpa
version: "1.0"
description: "HPL with HPA: explore hypotheses, compute HPA evidence, verify with MAKER, then promote to theorems."

defaults:
  llm_call:
    # --------------------------------------------------------
    #  LLM call guardrails (Worker + Coordinator)
    # --------------------------------------------------------
    max_length: 102400
    strict_parse: true
    timeout_seconds: 180
    idle_timeout_seconds: 30
    # --------------------------------------------------------
    #  System prompt (shared) - HPA paper as reference + fast consensus
    #
    #  Reference: articles/2025_holographic_polar_arithmetic
    #
    #  Goal:
    #  - Use HPA as a discipline to converge quickly: minimal assumptions, explicit gaps, decisive verdicts.
    #  - Deterministic HPA ops are computed by the workflow (scan/embedding/evidence); do NOT invent them.
    # --------------------------------------------------------
    system: |
      You are an agent in an HPA-augmented multi-agent theorem discovery loop.
      Treat the paper "Holographic Polar Arithmetic" (2025) as your reference model.

      Core triad (Rotation → Factorization → Projection):
      - Rotation (scan Θ): "time" is the iteration/access-order; irrational rotation is used to avoid resonance (golden branch α=φ^{-1}).
      - Factorization: represent claims by explicit generators (axiom/theorem IDs) and an ordered reasoning path.
      - Projection/readout: only accept closed arguments; any implicity step/assumption that is physically implausible or contradictory, or is UNJUSTIFIED or NOT DERIVABLE from given facts with implicit steps that are physically plausible is a residual gap δ and must be stated explicitly.

      Key constructs you must respect (paper-aligned):
      - Embedding: Z(n)=ρ(n)·exp(i·θ×(n)); θ× is additive under multiplication (homomorphic phase).
      - Octonionic lift: unit direction U(n)∈S^7 from a left-normed prime product; ordering matters (path dependence).
      - Associator A(x,y,z)=(xy)z−x(yz) measures non-associativity; interpret large A as fragile/ordering-dependent reasoning.
      - Golden branch: minimal complexity + canonical binary encoding (Zeckendorf/Ostrowski intuition) → prefer minimal, checkable steps.

      Fast-consensus mode:
      - Be decisive: choose accept/refute with one minimal reason.
      - Prefer minimal repairs: change as little as possible to reduce δ.
      - If you cannot fully prove, do NOT hedge: output accept=false with the minimal gap δ.

      Hard constraints:
      - Do NOT invent axioms/facts/IDs.
      - Follow the output schema exactly.
      - When JSON is required, output JSON only (no markdown, no commentary).
      - CRITICAL: The JSON output must be a SINGLE, COMPLETE object.
      - After outputting the final closing brace }, STOP generating immediately.
      - Do NOT continue thinking, do NOT add commentary, do NOT repeat fields.

  fan_out:
    # --------------------------------------------------------
    #  fan_out guardrails (Coordinator)
    # --------------------------------------------------------
    timeout_seconds: 600
    include_failures: true

  vote:
    # --------------------------------------------------------
    #  vote guardrails (Coordinator)
    # --------------------------------------------------------
    red_flag: english
    max_red_flags: 20

inputs:
  - name: task
    type: string
    required: true
    description: "Raw task text. Must include AXIOMS lines (O1:/A1: ...)."

  - name: context
    type: object
    required: false
    description: "Optional extra context."

  - name: state
    type: object
    required: false
    description: "Internal loop state (recursive)."

  - name: k
    type: int
    default: 3
    description: "Consensus threshold K. Worker count N is expected to be 2K-1."

  - name: max_rounds
    type: int
    default: 10
    description: "Max rounds for vote steps."

  - name: similarity
    type: float
    default: 0.85
    description: "Semantic clustering threshold (if embeddings enabled)."

  - name: max_depth
    type: int
    default: 50
    description: "Max loop iterations (recursion depth cap)."

  - name: top_k_facts
    type: int
    default: 20
    description: "Top-k relevant theorems for RelevantFacts retrieval."

  # --------------------------------------------------------
  # HPA knobs (all deterministic, no extra LLM calls)
  # --------------------------------------------------------
  - name: hpa_alpha
    type: float
    default: 0.6180339887498949
    description: "Scan slope α (golden branch default: φ^{-1})."

  - name: hpa_seed_phase
    type: float
    default: 0.0
    description: "Scan intercept/seed phase in [0,1)."

  - name: hpa_beta_model
    type: string
    default: "random_prime_phase"
    description: "Phase model: log_phase | omega_phase | random_prime_phase"

  - name: hpa_beta0
    type: float
    default: 4.0
    description: "β0 for log_phase (θ≈β0·log)."

  - name: hpa_beta1
    type: float
    default: 2.0
    description: "β1 for omega_phase (θ≈β1·Ω)."

  - name: hpa_seed
    type: int
    default: 0
    description: "Deterministic hash seed for octonion lift / random-phase."

  - name: hpa_radial_w_base
    type: float
    default: 0.12
    description: "Radial weight base (ρ=exp(sum w))."

  - name: hpa_radial_w_scale
    type: float
    default: 0.38
    description: "Radial weight scale (ρ=exp(sum w))."

  # --------------------------------------------------------
  # HPA gate thresholds (tunable)
  # --------------------------------------------------------
  - name: min_coherence
    type: float
    default: 0.55
    description: "Minimum coherence to enter verification."

  - name: max_gap_norm
    type: float
    default: 0.65
    description: "Maximum normalized gap to enter verification."

  - name: max_associator_mean
    type: float
    default: 1.5
    description: "Maximum associator mean to enter verification."

  - name: language
    type: string
    default: "English"
    description: "Natural language for statements/proofs/reasons (JSON keys remain unchanged)."

steps:
  # --------------------------------------------------------
  # Step 0: init state (parse axioms, seed a starting hypothesis)
  # --------------------------------------------------------
  - id: ensure_state
    type: conditional
    condition: "{{ state != null }}"
    if_false:
      - id: init_state
        type: llm_call
        prompt: |
          You are the coordinator of an HPA-augmented Hypothesis Promotion Loop.

          Operate under the HPA triad (Rotation → Factorization → Projection):
          - Rotation (Θ scan): time = iteration k (access order). A scan_target is computed later; do NOT invent it here.
          - Factorization (generators): every hypothesis MUST carry:
              depends_on: minimal set of generator IDs (axiom/theorem IDs)
              factor_sequence: ordered generator list (your reasoning order; used for octonion/associator signals)
          - Projection (readout): if a derivation would require ANY extra assumption/lemma not listed in depends_on,
            you must NOT smuggle it in. Keep the hypothesis narrow and mention the missing piece in motivation.

          CRITICAL - EXTRACTION ORDER (follow this sequence):
          1. FIRST: Extract axioms from raw_task. Each axiom is a line that begins with an ID prefix like "O1:" or "A1:".
          2. SECOND: Extract optional user guidance from raw_task (if present):
            - Focus / explore direction: the text under the header "Focus (optional):" (can be multi-line).
              This corresponds to the UI "Goal" field and should guide what hypotheses to propose next.
            - Seed hypothesis (optional): the text under the header "SeedHypothesis (optional):" (can be multi-line).
              If absent, also accept legacy inline formats inside Focus like "SeedHypothesis:" / "InitialHypothesis:".
            - Existing hypothesis (optional): the text under the header "ExistingHypothesis (optional):" (can be multi-line).
              This is a hypothesis pool that already exists and MUST be stored in state.existing_hypothesis for reference.
              CRITICAL: Extract ALL text after "ExistingHypothesis (optional):" until the next header (or end of raw_task).
            - Store these into state.focus, state.seed_hypothesis, and state.existing_hypothesis for later rounds.
            - If a user seed hypothesis includes extra premises not represented by allowed IDs, do NOT smuggle them in:
              either weaken the statement to be unconditional, or move the extra premise into motivation as a gap δ.
          - Propose EXACTLY ONE additional assumption (S1) as a "quantum-structure setup".
            - It does NOT have to be derivable from the axioms, but it should be plausible and NOT obviously inconsistent with them.
            - It MUST be explicit and operational (a concrete structural choice), not a vague slogan.
            - Typical good forms: "the global state is the ground state of a local Hamiltonian on G", "bulk/boundary code is realized by a tensor network of type X",
              "local degrees of freedom are qudits of dimension d on vertices", "a stabilizer / gauge constraint is imposed", etc.
            - This is NOT an axiom: record it under state.assumptions and cite it as [S1] when used.
          - For depends_on/factor_sequence, use ONLY existing IDs:
            - Axiom IDs: the prefix before ":" (e.g. "O1", "A2")
            - Assumption IDs: from state.assumptions (exactly ["S1"])
            - Theorem IDs (only if present in the initial theorems list, e.g. "T3")
          - Seed current_hypothesis from state.existing_hypothesis (CRITICAL: MUST select from existing_hypothesis, do NOT generate new).
            - If state.existing_hypothesis is non-empty, select ONE hypothesis from it as the seed hypothesis (parse it if it's a multi-line string or JSON array).
            - If state.seed_hypothesis is also non-empty, prefer selecting a hypothesis from existing_hypothesis that aligns with seed_hypothesis.
            - The selected hypothesis MUST include depends_on and factor_sequence. If missing, infer them from the statement and available axioms/theorems.
          - If no ExistingHypothesis is provided, seed an initial hypothesis (current_hypothesis) that is plausibly derivable.
            - Avoid conditional premises like "if G is finite / if boundary area is finite / assume ...".
            - If you notice a missing lemma in motivation, that means the hypothesis is NOT suitable as the seed.
          CRITICAL OUTPUT REQUIREMENTS:
          - Return ONLY valid JSON (no markdown, no code blocks, no commentary, no ```json tags).
          - Output the JSON object EXACTLY ONCE. Do NOT repeat any fields, values, or fragments.
          - Do NOT append anything after the closing brace } of the JSON object.
          - Do NOT include duplicate closing braces like }}.
          - Do NOT include any text, numbers, or characters after the JSON object ends.
          - CRITICAL: Do NOT repeat the last field (status) or any other field after the closing brace.
          - The JSON object MUST end with a single closing brace }. Nothing should come after it.

          raw_task:
          {{ task }}
          {% if context %}
          context:
          {{ context | json }}
          {% endif %}

          EXTRACTION INSTRUCTIONS FOR existing_hypothesis (CRITICAL - MUST FOLLOW):
          1. Search for the exact line "ExistingHypothesis (optional):" in raw_task (case-sensitive, may have leading/trailing spaces).
          2. If found, extract ALL text that follows this line until you encounter:
             - The next header line that starts with a capital letter followed by a colon (e.g., "ContinueOnFailure:", "AXIOMS:", "Focus:", "SeedHypothesis:", etc.), OR
             - The end of raw_task
          3. Remove any leading/trailing whitespace from the extracted text, but preserve all internal line breaks, spaces, and formatting.
          4. Store the EXACT extracted text in state.existing_hypothesis field in your JSON output.
          5. Do NOT modify, reformat, or interpret the content. Preserve it exactly as provided.
          6. If "ExistingHypothesis (optional):" is NOT found in raw_task, set state.existing_hypothesis to "" (empty string).

          VERIFICATION CHECKLIST (before outputting JSON):
          - [ ] Did I search for "ExistingHypothesis (optional):" in raw_task?
          - [ ] Did I extract ALL text after that line until the next header or end?
          - [ ] Did I include state.existing_hypothesis in my JSON output?
          - [ ] Is state.existing_hypothesis a string (not null, not missing)?

          Example:
          If raw_task contains:
          ```
          ExistingHypothesis (optional):
          Hypothesis 1: The native structure corresponds to the global minimum.
          Hypothesis 2: TM-score is length-independent.
          ContinueOnFailure:
          true
          ```

          Then state.existing_hypothesis should be:
          "H1: The native structure corresponds to the global minimum.\nH2: TM-score is length-independent."

          (Note: The text "ContinueOnFailure:" is NOT included because it's the next header)

          Output JSON schema (output EXACTLY ONCE, no duplicates):
          {
            "focus": string,
            "seed_hypothesis": string,
            "existing_hypothesis": string,
            "axioms": [string],
            "assumptions": [
              { "id": string, "statement": string, "motivation": string }
            ],
            "theorems": [
              { "id": string, "statement": string, "proof": string, "depends_on": [string] }
            ],
            "current_hypothesis": {
              "id": string,
              "statement": string,
              "motivation": string,
              "depends_on": [string],
              "factor_sequence": [string]
            },
            "iteration": int,
            "max_iterations": int,
            "seen_hypotheses": [string],
            "last_candidate": {
              "id": string,
              "statement": string,
              "motivation": string,
              "depends_on": [string],
              "factor_sequence": [string]
            } | null,
            "last_worker_verdicts": [],
            "last_b_pool": [],
            "last_judgement": { "proved": bool, "reason": string } | null,
            "history": [],
            "done": bool,
            "status": "running" | "completed" | "failed" | "limit"
          }

          CRITICAL: After outputting the closing brace }, STOP immediately. Do NOT output "status": "running"} or any other field/value after the closing brace.

          Constraints (MANDATORY - all must be satisfied):
          - iteration MUST start at 0.
          - max_iterations MUST be set to max_depth={{max_depth}}.
          - seen_hypotheses MUST start empty.
          - assumptions MUST contain exactly 1 item with id="S1".
          - focus MUST be a string (use "" if not provided).
          - seed_hypothesis MUST be a string (use "" if not provided).
       
          Language: {{language}}
        output: json
        store: state

  # --------------------------------------------------------
  # Step HPA-0: prepare scan + theorem embeddings (token-free)
  # --------------------------------------------------------
  - id: hpa_prepare
    type: hpa
    ops:
      - op: scan_target
        iteration: "{{ state.iteration }}"
        alpha: "{{ hpa_alpha }}"
        seed_phase: "{{ hpa_seed_phase }}"
        store: scan

      - op: embed_list
        from: "state.theorems"
        id_field: "id"
        attach_field: "hpa"
        beta_model: "{{ hpa_beta_model }}"
        beta0: "{{ hpa_beta0 }}"
        beta1: "{{ hpa_beta1 }}"
        seed: "{{ hpa_seed }}"
        radial_w_base: "{{ hpa_radial_w_base }}"
        radial_w_scale: "{{ hpa_radial_w_scale }}"
        store: theorem_index

  # --------------------------------------------------------
  # Step 1: choose hypothesis A for this round
  # - if state.current_hypothesis exists: use it
  # - else: coordinator proposes one
  # --------------------------------------------------------
  - id: ensure_candidate
    type: conditional
    condition: "{{ state.current_hypothesis != null }}"
    if_true:
      - id: use_current_hypothesis
        type: assign
        from: "state.current_hypothesis"
        store: candidate
    if_false:
      - id: prepare_theorem_context
        type: transform
        ops:
          - op: take_last
            from: state.theorems
            n: 30
            store: recent_theorems_raw

          - op: project_fields
            from: recent_theorems_raw
            fields: ["id", "statement"]
            store: recent_theorems

      - id: propose_hypothesis
        type: llm_call
        prompt: |
          You are the coordinator in an HPA-augmented theorem discovery loop.
          Select ONE hypothesis (Hypothesis A) from the existing_hypothesis pool to explore next.

          CRITICAL: You MUST select a hypothesis from state.existing_hypothesis that is NOT already proven. Do NOT generate new hypotheses.

          Operate under the HPA triad (Rotation → Factorization → Projection):

          1) Rotation (Θ scan / access order):
             - scan.target_phase01 is a deterministic exploration target (golden irrational rotation).
             
             

          2) Factorization (generators):
             - You MUST output:
                 depends_on: minimal set of generator IDs
                 factor_sequence: ordered list of generator IDs (your intended reasoning order)
             - Allowed IDs:
                 - Axiom IDs: the prefix before ":" in state.axioms (e.g. "O1", "A2")
                 - Assumption IDs: from state.assumptions (e.g. "S1")
                 - Theorem IDs: only those listed in Recent proved theorems below
             - Never invent IDs. Keep depends_on small (prefer <= 3).

          3) Projection (readout / gap discipline):
             - Do NOT introduce new axioms/lemmas/assumptions beyond what is provided in state (axioms/theorems/assumptions).
             - If you suspect an extra lemma is needed, weaken/narrow the statement instead of smuggling assumptions.

          Selection requirements:
          - You MUST select ONE hypothesis from state.existing_hypothesis (parse it if it's a multi-line string or JSON array).
          - If the selected hypothesis lacks depends_on or factor_sequence, infer them from the statement and available axioms/theorems.
          - If existing_hypothesis is empty, return an error message in the statement field.

          CRITICAL OUTPUT REQUIREMENTS:
          - Return ONLY valid JSON (no markdown, no code blocks, no commentary, no ```json tags).
          - Output the JSON object EXACTLY ONCE. Do NOT repeat any fields, values, or fragments.
          - Do NOT append anything after the closing brace } of the JSON object.
          - Do NOT include duplicate closing braces like }}.
          - Do NOT include any text, numbers, or characters after the JSON object ends.
          - After outputting the closing brace }, STOP immediately. Do NOT continue with any text.

          Axioms:
          {{ state.axioms | json }}

          Assumptions (extra premises, cite as [S1] when used):
          {{ state.assumptions | json }}

          User focus / explore direction (optional):
          {{ state.focus | default: "" }}

          User-provided seed hypothesis (optional, for context only):
          {{ state.seed_hypothesis | default: "" }}

          Existing hypotheses pool (MUST select from here):
          {{ state.existing_hypothesis | json  }}

          IMPORTANT: If the above "Existing hypotheses pool" appears empty or is just "", this means state.existing_hypothesis was not properly extracted during init_state.
          You should report this as an error in your response, as you cannot select from an empty pool.

          Recent proved theorems (id + statement only):
          {{ recent_theorems | json }}

          Seen hypotheses (normalized strings):
          {{ state.seen_hypotheses | json }}

          ScanTarget (golden scan):
          {{ scan | json }}

          Output JSON schema:
          {
            "id": string,
            "statement": string,
            "motivation": string,
            "depends_on": [string],
            "factor_sequence": [string]
          }

          Language: {{language}}
        output: json
        store: candidate

  # --------------------------------------------------------
  # Step HPA-1: embed candidate (token-free)
  # --------------------------------------------------------
  - id: embed_candidate
    type: hpa
    ops:
      - op: embed_node
        node: "{{ candidate }}"
        attach_field: "hpa"
        beta_model: "{{ hpa_beta_model }}"
        beta0: "{{ hpa_beta0 }}"
        beta1: "{{ hpa_beta1 }}"
        seed: "{{ hpa_seed }}"
        radial_w_base: "{{ hpa_radial_w_base }}"
        radial_w_scale: "{{ hpa_radial_w_scale }}"
        store: candidate_hpa

  # --------------------------------------------------------
  # Step 2: retrieve RelevantFacts (token guardrail)
  # --------------------------------------------------------
  - id: retrieve_relevant_facts
    type: retrieve_facts
    query: "{{ candidate.statement }}"
    source: "state.theorems"
    text_field: "statement"
    id_field: "id"
    top_k: "{{ top_k_facts }}"
    mode: lexical
    store: relevant_facts

  # --------------------------------------------------------
  # Step 3: refute-first scouts (2 workers)
  # --------------------------------------------------------
  - id: build_scouts
    type: transform
    ops:
      - op: set
        value:
          - { id: "scout-0", role: "Counterexample hunter", angle: "Try to find a fatal counterexample or contradiction quickly." }
          - { id: "scout-1", role: "Missing-premise hunter", angle: "Try to find the minimal missing assumption that breaks the hypothesis." }
        store: scouts

  - id: refute_scout
    type: fan_out
    for_each: scouts
    include_failures: true
    reduce: collect
    step:
      type: llm_call
      prompt: |
        You are {{item.role}} ({{item.id}}).
        Angle: {{item.angle}}

        Task:
        Evaluate Hypothesis A. Your top priority is to find a STRONG refutation if it exists.

        HPA operating rules (Factorization → Projection):
        - Factorization: you MUST report depends_on + factor_sequence (ordered reasoning path).
        - Projection / gap δ: 
          * SIMPLE RULE: accept=true if hypothesis A is CONSISTENT with given axioms/facts and represents a reasonable mathematical claim
              
              * What constitutes a valid derivation (accept=true):
                1. Direct application of axioms/theorems
                2. Logical inferences (modus ponens, transitivity, etc.)
                3. Mathematical operations based on definitions
                4. Reasonable implicit steps that follow obviously, physically plausible or logically correct
                5. Properties that can be DERIVED from known definitions, even if not explicitly stated in axioms
                6. Reasonable mathematical claims that are CONSISTENT with the axioms/facts, even if they require additional 
                   mathematical knowledge (e.g., theta series, mass formulas, combinatorial theorems) to prove rigorously.
                   The key is CONSISTENCY, not complete derivability from the given axioms alone.
                7. Combinatorial counting formulas that are mathematically plausible given the structure defined in axioms
                   (e.g., |OO_p| = 240(1+p^3) for E8 lattice elements, even if proving it requires theta series knowledge)
              
              * What constitutes gap δ (accept=false):
                1. Explicit contradiction with axioms/facts
                2. Counterexample exists that can be constructed from the given axioms/facts
                3. Crucial logical step is physically implausible or contradictory
                4. Missing assumption that is INCORRECT or contradicts known facts
                5. The hypothesis is logically inconsistent with the definitions provided
              
              * CRITICAL: Do NOT confuse:
                - "Step not explicitly written" (allowed in proof sketch) → accept=true
                - "Property derivable from definitions" (should be accept=true, NOT gap δ)
                - "Requires additional mathematical knowledge to prove" (should be accept=true if consistent) → NOT gap δ
                - "Step not justifiable from axioms and physically implausible" (gap δ) → accept=false
              
              * IMPORTANT PRINCIPLE: 
                - If a hypothesis is CONSISTENT with the axioms/facts and represents a reasonable mathematical claim,
                  it should be accept=true, even if proving it rigorously would require additional mathematical knowledge
                  (theta series, mass formulas, combinatorial theorems, etc.).
                - For example: |OO_p| = 240(1+p^3) is a reasonable claim about E8 lattice elements that is consistent
                  with O6 and O7, even though proving it requires theta series knowledge. This should be accept=true.
                - Only reject (accept=false) if the hypothesis CONTRADICTS the axioms/facts or is logically inconsistent.
          * When gap δ exists: put it in gap_or_counterexample and set accept=false.
        - Non-associativity signal: factor_sequence MUST reflect your actual reasoning order (path dependence matters).

        CRITICAL OUTPUT REQUIREMENTS:
        - Return ONLY valid JSON (no markdown, no code blocks, no commentary, no ```json tags).
        - Output the JSON object EXACTLY ONCE. Do NOT repeat any fields, values, or fragments.
        - Do NOT append anything after the closing brace } of the JSON object.
        - Do NOT include duplicate closing braces like }}.
        - Do NOT include any text, numbers, or characters after the JSON object ends.
        - Do NOT output multiple JSON objects. Extract and output ONLY the first complete JSON object.
        - After outputting the closing brace }, STOP immediately. Do NOT continue with any text.
        - Validate your JSON structure before outputting. Count opening and closing braces to ensure balance.
        - EXAMPLE OF CORRECT OUTPUT: {"worker_id": "scout-1", "accept": false, ...}
        - EXAMPLE OF WRONG OUTPUT: {"worker_id": "scout-1", ...} is an unproven claim.  ← WRONG! No text after }
        - EXAMPLE OF WRONG OUTPUT: {"worker_id": "scout-1", ...}{"worker_id": "scout-1", ...}  ← WRONG! No duplicates

        Rules:
        - Use ONLY the axioms + assumptions + relevant facts provided.
        - If accept=true: provide a short proof (<= 10 steps), with each step citing used IDs like [O1,T2].
        - If accept=false: provide minimal gap δ (only for INCORRECT missing lemma/assumption) or counterexample (one short paragraph).
          Note: CORRECT missing lemma/assumption that can be derived from axioms/facts or is physically plausibleshould NOT cause accept=false.
        - strong_refutation=true ONLY if you can state an explicit fatal counterexample/contradiction
          derived from provided axioms/facts with NO extra assumptions. If it's merely "missing lemma" (and the lemma is CORRECT),
          set strong_refutation=false. Only put INCORRECT missing lemma/assumption in gap_or_counterexample as gap δ.
        - For combinatorial counting formulas (e.g., |OO_p| = 240(1+p^3)): 
          * If the formula is CONSISTENT with the given axioms/facts and represents a reasonable mathematical claim, accept=true.
          * Even if the formula requires additional combinatorial theorems (theta series, mass formulas) to prove rigorously,
            if it is consistent with the structure defined in axioms (e.g., E8 lattice in O6, norm-p shell in O7), accept=true.
          * Only set accept=false if the formula CONTRADICTS the axioms/facts or is logically inconsistent.
          * Example: |OO_p| = 240(1+p^3) is consistent with O6 (E8 lattice) and O7 (norm-p shell), so accept=true,
            even though proving it requires theta series knowledge not in the axioms.
        - Do NOT invent IDs. depends_on must be a subset of available axiom/theorem/assumption IDs.

        Axioms:
        {{ state.axioms | json }}

        Assumptions:
        {{ state.assumptions | json }}

        User focus / explore direction (optional):
        {{ state.focus | default: "" }}

        User-provided seed hypothesis (optional, for context only):
        {{ state.seed_hypothesis | default: "" }}

        RelevantFacts (top-k theorems):
        {{ relevant_facts | json }}

        Hypothesis A:
        {{ candidate | json }}

        IMPORTANT: For this task, always set proposed_b = [] (empty array). Do NOT propose any alternative hypotheses.
        Output JSON schema (output EXACTLY ONCE, no duplicates):
        {
          "worker_id": "{{item.id}}",
          "accept": bool,
          "strong_refutation": bool,
          "confidence": number,
          "proof": string,
          "gap_or_counterexample": string,
          "depends_on": [string],
          "factor_sequence": [string],
          "proposed_b": [
            { "statement": string, "motivation": string, "depends_on": [string], "factor_sequence": [string] }
          ]
        }
        

        Language: {{language}}
      output: json
    store: scout_verdicts

  - id: aggregate_scout
    type: transform
    ops:
      # Strong refutation gate (quorum):
      # - Avoid a single overzealous scout blocking the whole round.
      # - Require BOTH scouts to independently mark strong_refutation=true.
      - op: count_where
        from: scout_verdicts
        where: { field: "strong_refutation", equals: true }
        store: scout_strong_refutation_count

      - op: eval
        expr: "scout_strong_refutation_count >= 2"
        store: scout_has_strong_refutation

      - op: select_many
        from: scout_verdicts
        field: "proposed_b"
        store: scout_b_raw

      - op: distinct
        from: scout_b_raw
        key: "statement"
        store: scout_b_candidates

  # --------------------------------------------------------
  # Step 4: branch - early stop if strong refutation
  # --------------------------------------------------------
  - id: scout_gate
    type: conditional
    condition: "{{ scout_has_strong_refutation == true }}"

    # ===== Early stop: strong refutation => clear current_hypothesis =====
    if_true:
      - id: clear_current_hypothesis_after_scout
        type: transform
        ops:
          - op: set_path
            target: state
            path: current_hypothesis
            value: null

    # ===== No strong refutation: full exploration =====
    if_false:
      # Build N=2K-1 provers (diverse roles)
      - id: build_provers
        type: transform
        ops:
          - op: make_workers
            n: "{{ (k * 2) - 1 }}"
            id_prefix: "worker-"
            # Bias towards proving (scouts already cover refutation-first).
            profiles:
              - { role: "Direct prover", angle: "Try to construct the shortest proof path." }
              - { role: "Algebraic manipulator", angle: "Try algebraic/rewriting transformations; simplify aggressively." }
              - { role: "Dependency minimalist", angle: "Try to reduce dependency set; prefer proofs close to axioms." }
              - { role: "Case-split specialist", angle: "Try a structured case analysis; look for missing branches." }
              - { role: "Proof auditor", angle: "Audit for hidden leaps; insist on explicit justification." }
            store: provers

      # Full exploration fan_out
      - id: prove_or_refute_with_workers
        type: fan_out
        for_each: provers
        include_failures: true
        reduce: collect
        step:
          type: llm_call
          prompt: |
            You are {{item.role}} ({{item.id}}).
            Angle: {{item.angle}}

            Task:
            Evaluate Hypothesis A: prove it OR refute it (gap/counterexample).

            CRITICAL EVALUATION STANDARD:
            - The standard is CONSISTENCY, NOT complete derivability from axioms alone.
            - If a hypothesis is CONSISTENT with the axioms/facts and represents a reasonable mathematical claim, 
              you MUST set accept=true, even if proving it rigorously requires additional mathematical knowledge 
              (theta series, mass formulas, combinatorial theorems, etc.).
            - "Requires external knowledge to prove" does NOT mean accept=false.
            - Only set accept=false if the hypothesis CONTRADICTS the axioms/facts or is logically inconsistent.
            
           
            HPA operating rules (Factorization → Projection):
            - Factorization: you MUST report depends_on + factor_sequence (ordered reasoning path).
            - Projection / gap δ: 
               * SIMPLE RULE: accept=true if hypothesis A is CONSISTENT with given axioms/facts and represents a reasonable mathematical claim
               
               * CRITICAL REMINDER: "Requires external knowledge to prove" does NOT mean accept=false. 
                 Only reject if the hypothesis CONTRADICTS the axioms/facts or is logically inconsistent.
              
              * What constitutes a valid derivation (accept=true):
                1. Direct application of axioms/theorems
                2. Logical inferences (modus ponens, transitivity, etc.)
                3. Mathematical operations based on definitions
                4. Reasonable implicit steps that follow obviously, physically plausible or logically correct
                5. Properties that can be DERIVED from known definitions, even if not explicitly stated in axioms
                6. Reasonable mathematical claims that are CONSISTENT with the axioms/facts, even if they require additional 
                   mathematical knowledge (e.g., theta series, mass formulas, combinatorial theorems) to prove rigorously.
                   The key is CONSISTENCY, not complete derivability from the given axioms alone.
                7. Combinatorial counting formulas that are mathematically plausible given the structure defined in axioms, even if proving it requires theta series knowledge
                   
              
              * What constitutes gap δ (accept=false):
                1. Explicit contradiction with axioms/facts
                2. Counterexample exists that can be constructed from the given axioms/facts
                3. Crucial logical step is physically implausible or contradictory
                4. Missing assumption that is INCORRECT or contradicts known facts
                5. The hypothesis is logically inconsistent with the definitions provided
              
              * CRITICAL: Do NOT confuse:
                - "Step not explicitly written" (allowed in proof sketch) → accept=true
                - "Property derivable from definitions" (should be accept=true, NOT gap δ)
                - "Requires additional mathematical knowledge to prove" (should be accept=true if consistent) → NOT gap δ
                - "Step not justifiable from axioms and physically implausible" (gap δ) → accept=false
              
              * IMPORTANT PRINCIPLE: 
                - If a hypothesis is CONSISTENT with the axioms/facts and represents a reasonable mathematical claim,
                  it should be accept=true, even if proving it rigorously would require additional mathematical knowledge
                  (theta series, mass formulas, combinatorial theorems, etc.).
                - Only reject (accept=false) if the hypothesis CONTRADICTS the axioms/facts or is logically inconsistent.
              * When gap δ exists: put it in gap_or_counterexample and set accept=false.
            - Non-associativity signal: factor_sequence MUST reflect your actual reasoning order (path dependence matters).

            CRITICAL OUTPUT REQUIREMENTS:
            - Return ONLY valid JSON (no markdown, no code blocks, no commentary, no ```json tags).
            - Output the JSON object EXACTLY ONCE. Do NOT repeat any fields, values, or fragments.
            - Do NOT append anything after the closing brace } of the JSON object.
            - Do NOT include duplicate closing braces like }}.
            - Do NOT include any text, numbers, or characters after the JSON object ends.
            - After outputting the closing brace }, STOP immediately. Do NOT continue with any text.

            Rules:
            - Use ONLY the axioms + assumptions + relevant facts provided.
            - If accept=true: provide a short proof SKETCH (<= 10 steps), each step cites used IDs like [O1,T2].
              It can be high-level, but MUST stay within provided axioms/facts and MUST NOT introduce new assumptions.
              If you're uncertain but see no refutation and the sketch is plausible, you may still set accept=true with lower confidence.
            - If accept=false: provide minimal gap δ (only for INCORRECT missing lemma/assumption) or counterexample. Do NOT propose alternative hypotheses (leave proposed_b empty).
              Note: CORRECT missing lemma/assumption that can be derived from axioms/facts, is physically plausible or logically correct should NOT cause accept=false.
            - strong_refutation=true ONLY for an explicit fatal counterexample/contradiction with no extra assumptions.
            - For combinatorial counting formulas (e.g., |OO_p| = 240(1+p^3)): 
              * CRITICAL: If the formula is CONSISTENT with the given axioms/facts and represents a reasonable mathematical claim, 
                you MUST set accept=true, even if proving it requires theta series or mass formulas.
              * Only set accept=false if the formula CONTRADICTS the axioms/facts or is logically inconsistent.
              * REMEMBER: "Not derivable from axioms alone" ≠ "gap δ". Only contradictions and logical inconsistencies are gap δ.
            - Do NOT invent IDs. depends_on must be a subset of available axiom/theorem/assumption IDs.

            Axioms:
            {{ state.axioms | json }}

            Assumptions:
            {{ state.assumptions | json }}

            User focus / explore direction (optional):
            {{ state.focus | default: "" }}

            User-provided seed hypothesis (optional, for context only):
            {{ state.seed_hypothesis | default: "" }}

            Existing hypotheses pool (MUST select from here):
              {{ state.existing_hypothesis | json  }}

            RelevantFacts:
            {{ relevant_facts | json }}

            Hypothesis A:
            {{ candidate | json }}

            Output JSON schema:
            {
              "worker_id": "{{item.id}}",
              "accept": bool,
              "strong_refutation": bool,
              "confidence": number,
              "proof": string,
              "gap_or_counterexample": string,
              "depends_on": [string],
              "factor_sequence": [string],
              "proposed_b": [
                { "statement": string, "motivation": string, "depends_on": [string], "factor_sequence": [string] }
              ]  # MUST always be empty for this task
            }


            Language: {{language}}
          output: json
        store: worker_verdicts

      # Aggregate counts + B pool
      - id: aggregate_verdicts
        type: transform
        ops:
          - op: count_where
            from: worker_verdicts
            where: { field: "accept", equals: true }
            store: accept_count

          - op: count_where
            from: worker_verdicts
            where: { field: "strong_refutation", equals: true }
            store: strong_refutation_count

          - op: select_many
            from: worker_verdicts
            field: "proposed_b"
            store: b_raw

          - op: distinct
            from: b_raw
            key: "statement"
            store: b_pool

      # HPA evidence layer (token-free): coherence / gap / associator
      - id: hpa_evidence
        type: hpa
        ops:
          - op: evidence_synthesize
            candidate: "{{ candidate }}"
            verdicts: "worker_verdicts"
            relevant: "relevant_facts"
            theorem_index: "theorem_index"
            beta_model: "{{ hpa_beta_model }}"
            beta0: "{{ hpa_beta0 }}"
            beta1: "{{ hpa_beta1 }}"
            seed: "{{ hpa_seed }}"
            radial_w_base: "{{ hpa_radial_w_base }}"
            radial_w_scale: "{{ hpa_radial_w_scale }}"
            store: evidence

          - op: associator_stats
            candidate: "{{ candidate }}"
            verdicts: "worker_verdicts"
            beta_model: "{{ hpa_beta_model }}"
            beta0: "{{ hpa_beta0 }}"
            beta1: "{{ hpa_beta1 }}"
            seed: "{{ hpa_seed }}"
            store: assoc

      # Decide: enter verification?
      - id: decide_verify
        type: conditional
        # Two-tier gate:
        # - If worker acceptance is strong (>=k), verify regardless of HPA metrics.
        # - Otherwise require a softer acceptance (>=k-1) + HPA stability metrics.
        condition: "{{ strong_refutation_count == 0 && (accept_count >= k || (accept_count >= (k - 1) && evidence.coherence >= min_coherence && evidence.gap_norm <= max_gap_norm && assoc.associator_mean <= max_associator_mean)) }}"

        # ===== Verification path =====
        if_true:
          - id: maker_argumentation
            type: workflow_call
            workflow: maker-v2
            params:
              task: |
                Provide a structured, dependency-cited argumentation for Hypothesis A.

                HPA protocol (Factorization → Projection):
                - Treat "proof" as projection: every step must be grounded in cited dependencies; no hidden assumptions.
                - If any step requires an unstated lemma/assumption that CANNOT be inferred from provided axioms/theorems with implicit steps that are physically plausible declare it as GAP δ and STOP (do not proceed).
                - If a step follows logically from given premises through standard inference rules (modus ponens, transitivity, algebra, etc.), it is NOT considered a GAP δ and you may proceed.
                - Factorization: keep a minimal depends_on list and an ordered factor_sequence that matches your step order.

                Hypothesis A:
                {{ candidate | json }}

                Deterministic HPA signals (read-only; do NOT recompute):
                scan: {{ scan | json }}
                evidence: {{ evidence | json }}
                associator: {{ assoc | json }}

                Use only the following axioms, assumptions, and relevant facts.
                Axioms:
                {{ state.axioms | json }}

                Assumptions:
                {{ state.assumptions | json }}

                RelevantFacts:
                {{ relevant_facts | json }}

                Output format (plain text, no JSON):
                - First line: depends_on: [..] ; factor_sequence: [..]
                - Then numbered steps 1..N (N<=10), each ends with citations like [O1,T3].
                - If failed: GAP δ: <minimal missing lemma/counterexample>
              context: "{{context}}"
              k: "{{k}}"
              max_rounds: "{{max_rounds}}"
              max_depth: "{{max_depth}}"
            store: maker_output

          - id: extract_maker_solution
            type: assign
            from: "maker_output.solution"
            store: maker_solution

          - id: verify_maker_solution
            type: vote
            k: "{{k}}"
            max_rounds: "{{max_rounds}}"
            similarity: "{{similarity}}"
            generator:
              type: llm_call
              prompt: |
                You are a strict verifier in an HPA loop.
                Decide whether Hypothesis A is PROVED given axioms + assumptions + relevant facts, based on the MAKER solution.

                HPA judgement rules (Projection / gap δ):
                - proved=true if the argument is internally consistent and stays within provided axioms/facts and any implicit steps that are physically plausible.
                - Be pragmatic: allow standard inference steps (algebra/rewriting) as long as they do NOT introduce new assumptions.
                - Mark proved=false ONLY when you can point to a concrete step that is physically implausible or contradictory, or counterexample (gap δ).
                - IMPORTANT: If the MAKER solution identifies that a formula requires additional mathematical knowledge (e.g., theta series, 
                  mass formulas) but the formula itself is CONSISTENT with the axioms/facts and represents a reasonable mathematical claim,
                  you should still accept it as proved=true, even if the rigorous proof requires external knowledge.
                
                What constitutes a valid proof step (proved=true):
                1. Direct application of axioms/theorems/assumptions
                2. Logical inferences (modus ponens, transitivity, etc.)
                3. Mathematical operations based on definitions
                4. Properties that can be DERIVED from definitions, even if not explicitly stated in axioms
                   - For example: If O5 defines octonion conjugation and norm, then properties like $\overline{xy}=\bar{y}\bar{x}$ 
                     can be derived from the definition of conjugation in composition algebras, even if not explicitly stated.
                5. Standard algebraic manipulations and rewriting that follow from the structure defined in axioms
                6. Reasonable implicit steps that are physically plausible or logically correct
                
                What constitutes gap δ (proved=false):
                1. Explicit contradiction with axioms/facts
                2. Counterexample exists that can be constructed from the given axioms/facts
                3. Crucial logical step is physically implausible or contradictory
                4. Introduction of a new assumption that contradicts known facts
                5. The proof step is logically inconsistent with the definitions provided
                
                CRITICAL: Do NOT confuse:
                - "Property derivable from definitions" (should be proved=true, NOT gap δ)
                - "Requires additional mathematical knowledge to prove rigorously" (should be proved=true if consistent)
                - "Step not explicitly written in axioms" (allowed if derivable from definitions)
                - "Step that contradicts axioms/facts" (gap δ) → proved=false
                
                IMPORTANT PRINCIPLE:
                - If a proof step uses a property that can be DERIVED from the definitions provided (even if not explicitly 
                  stated in axioms), it should be accepted as proved=true.
                - If the MAKER solution shows that a formula is consistent with the axioms/facts and identifies the mathematical 
                  knowledge needed to prove it (e.g., theta series for E8 lattice), but the formula itself does not contradict 
                  the axioms, you should accept it as proved=true.
                - For combinatorial counting formulas (e.g., |OO_p| = 240(1+p^3)):
                  * If the formula is CONSISTENT with the structure defined in axioms (e.g., E8 lattice in O6, norm-p shell in O7),
                    and the MAKER solution correctly identifies the connection to the lattice structure, accept as proved=true.
                  * Even if proving it rigorously requires theta series or mass formulas not in the axioms, if the formula is 
                    mathematically plausible and consistent, accept as proved=true.
                  * CRITICAL: If MAKER correctly identifies that the formula requires a theta function theorem (e.g., for E8 lattice),
                    but the formula itself is consistent with O6 and O7, you should accept as proved=true. The fact that the 
                    rigorous proof requires external knowledge does NOT make it a gap δ if the formula is mathematically plausible.
                  * Only reject (proved=false) if the formula CONTRADICTS the axioms/facts or the proof steps are logically inconsistent.
                - CRITICAL DISTINCTION:
                  * "Formula requires theta series to prove" (if consistent) → proved=true
                  * "Formula contradicts axioms/facts" → proved=false
                  * "MAKER identifies missing lemma but formula is consistent" → proved=true (the missing lemma is a known theorem, not a contradiction)
                - Only reject (proved=false) if the step CONTRADICTS the axioms/facts or is logically inconsistent.

                Factorization rules:
                - Output depends_on: minimal set of dependency IDs actually used.
                - Output factor_sequence: ordered list of dependency IDs matching the proof's citation order.
                - Do NOT invent IDs. Use only axiom IDs, assumption IDs, and theorem IDs present in RelevantFacts.

                CRITICAL OUTPUT REQUIREMENTS:
                - Return ONLY valid JSON (no markdown, no code blocks, no commentary, no ```json tags).
                - Output the JSON object EXACTLY ONCE. Do NOT repeat any fields, values, or fragments.
                - Do NOT append anything after the closing brace } of the JSON object.
                - Do NOT include duplicate closing braces like }}.
                - Do NOT include any text, numbers, or characters after the JSON object ends.
                - After outputting the closing brace }, STOP immediately. Do NOT continue with any text.

                Axioms:
                {{ state.axioms | json }}

                Assumptions:
                {{ state.assumptions | json }}

                RelevantFacts:
                {{ relevant_facts | json }}

                Hypothesis A:
                {{ candidate | json }}

                Deterministic HPA signals (read-only):
                scan: {{ scan | json }}
                evidence: {{ evidence | json }}
                associator: {{ assoc | json }}

                MAKER solution:
                {{ maker_solution }}

                Output JSON schema:
                {
                  "proved": bool,
                  "reason": string,
                  "final_proof": string,
                  "depends_on": [string],
                  "factor_sequence": [string]
                }


                Language: {{language}}
              output: json
            store: judgement

          - id: promote_or_fallback
            type: conditional
            condition: "{{ judgement.proved == true }}"

            # ---- Promote to theorem ----
            if_true:
              - id: promote_theorem
                type: transform
                ops:
                  - op: normalize
                    value: "{{ candidate.statement }}"
                    store: candidate_norm

                  - op: eval
                    expr: "state.iteration + 1"
                    store: next_idx

                  - op: set
                    value: "T{{ next_idx }}"
                    store: new_theorem_id

                  - op: set
                    value:
                      id: "{{ new_theorem_id }}"
                      statement: "{{ candidate.statement }}"
                      proof: "{{ judgement.final_proof }}"
                      depends_on: "{{ judgement.depends_on }}"
                      factor_sequence: "{{ judgement.factor_sequence }}"
                    store: new_theorem

                  - op: append_path
                    target: state
                    path: theorems
                    value: "{{ new_theorem }}"

                  # Deduplicate promoted theorems by statement (avoid trivial re-promotions / paraphrase collisions).
                  - op: distinct
                    from: state.theorems
                    key: statement
                    store: theorems_dedup

                  - op: set_path
                    target: state
                    path: theorems
                    value: "{{ theorems_dedup }}"

                  - op: inc_path
                    target: state
                    path: iteration
                    by: 1

                  - op: set_path
                    target: state
                    path: current_hypothesis
                    value: null

                  - op: set_path
                    target: state
                    path: last_candidate
                    value: "{{ candidate }}"

                  - op: set_path
                    target: state
                    path: last_worker_verdicts
                    value: "{{ worker_verdicts }}"

                  - op: set_path
                    target: state
                    path: last_judgement
                    value: "{{ judgement }}"

                  - op: set_path
                    target: state
                    path: hpa_last
                    value:
                      scan: "{{ scan }}"
                      candidate_hpa: "{{ candidate_hpa }}"
                      evidence: "{{ evidence }}"
                      assoc: "{{ assoc }}"

                  - op: set_path
                    target: state
                    path: last_b_pool
                    value: "{{ b_pool }}"

                  - op: set_path
                    target: state
                    path: hpa_last
                    value:
                      scan: "{{ scan }}"
                      candidate_hpa: "{{ candidate_hpa }}"
                      evidence: "{{ evidence }}"
                      assoc: "{{ assoc }}"

                  - op: append_unique_path
                    target: state
                    path: seen_hypotheses
                    value: "{{ candidate_norm }}"

                  - op: eval
                    expr: "state.iteration >= max_depth"
                    store: reach_limit

                  - op: set_path
                    target: state
                    path: done
                    value: "{{ reach_limit }}"

                  - op: set_path
                    target: state
                    path: status
                    value: running

                  - op: set_path_if
                    if: "{{ reach_limit }}"
                    target: state
                    path: status
                    value: limit

              # Token-free snapshot after promotion (lets UI/Graph update before workflow completes).
              - id: checkpoint_state_after_promote
                type: checkpoint
                variables:
                  - state

            # ---- Verification failed: clear current_hypothesis ----
            if_false:
              - id: clear_current_hypothesis_verify_failed
                type: transform
                ops:
                  - op: set_path
                    target: state
                    path: current_hypothesis
                    value: null

        # ===== No verification: vote next hypothesis from B pool =====
        if_false:
          - id: clear_current_hypothesis_no_verify
            type: transform
            ops:
              - op: set_path
                target: state
                path: current_hypothesis
                value: null
 
  # --------------------------------------------------------
  # Step 5: stop or recurse
  # --------------------------------------------------------
  - id: stop_or_continue
    type: conditional
    condition: "{{ state.done == true || state.iteration >= max_depth }}"
    if_false:
      - id: recurse
        type: workflow_call
        workflow: hypothesis_promotion_loop_hpa
        params:
          task: "{{task}}"
          context: "{{context}}"
          state: "{{state}}"
          k: "{{k}}"
          max_rounds: "{{max_rounds}}"
          similarity: "{{similarity}}"
          max_depth: "{{max_depth}}"
          top_k_facts: "{{top_k_facts}}"
          hpa_alpha: "{{hpa_alpha}}"
          hpa_seed_phase: "{{hpa_seed_phase}}"
          hpa_beta_model: "{{hpa_beta_model}}"
          hpa_beta0: "{{hpa_beta0}}"
          hpa_beta1: "{{hpa_beta1}}"
          hpa_seed: "{{hpa_seed}}"
          hpa_radial_w_base: "{{hpa_radial_w_base}}"
          hpa_radial_w_scale: "{{hpa_radial_w_scale}}"
          min_coherence: "{{min_coherence}}"
          max_gap_norm: "{{max_gap_norm}}"
          max_associator_mean: "{{max_associator_mean}}"
          language: "{{language}}"
        store: recursive_output

      - id: unwrap_state
        type: assign
        from: "recursive_output.state"
        store: state

output:
  status: "{{state.status}}"
  iteration: "{{state.iteration}}"
  state: "{{state}}"
  theorems: "{{state.theorems}}"
  current_hypothesis: "{{state.current_hypothesis}}"
  last_candidate: "{{state.last_candidate}}"
  last_judgement: "{{state.last_judgement}}"

