syntax = "proto3";

package aevatar.sessions;

option csharp_namespace = "Aevatar.Agents.Sessions";

import "google/protobuf/timestamp.proto";
import "ai_abstractions_messages.proto";
import "execution_trace.proto";
import "memory.proto";

// ============================================================
//  Session Contracts (Workflow YAML → Role Agents)
// ============================================================

message SessionRole {
  // Node id inside workflow YAML.
  string node_id = 1;
  // Role name resolved from node.type or params.role.
  string role = 2;
  // Actor id (normalized), may be empty before lazy load.
  string agent_id = 3;
  // Whether the agent actor has been created/initialized.
  bool loaded = 4;
}

message SessionState {
  string session_id = 1;
  // Input identifier, could be a file path or workflow name.
  string workflow_name = 2;
  // Resolved workflow file path (if found).
  string workflow_path = 3;

  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;

  map<string, string> tags = 12;
  repeated SessionRole roles = 13;
}

message StartSessionRequest {
  string session_id = 1;
  string workflow_name = 2;
}

message StartSessionResponse {
  SessionState state = 1;
}

message SessionAgentsResponse {
  string session_id = 1;
  repeated SessionRole roles = 2;
  repeated string agent_ids = 3;
}

message SessionAgentStateBundle {
  string agent_id = 1;
  Aevatar.Agents.AI.AevatarAIAgentState state = 2;
}

message SessionAgentStatesResponse {
  repeated SessionAgentStateBundle agents = 1;
}

message SessionAgentHistory {
  string agent_id = 1;
  repeated Aevatar.Agents.AI.AevatarChatMessage history = 2;
}

message SessionAgentHistoriesResponse {
  repeated SessionAgentHistory agents = 1;
}

message SessionMemoryEntriesResponse {
  repeated Aevatar.Agents.Memory.MemoryEntry entries = 1;
}

message SessionMemoryResourcesResponse {
  repeated Aevatar.Agents.Memory.MemoryResourceSummary resources = 1;
}

message SessionTraceResponse {
  Aevatar.Agents.Tracing.ExecutionTrace trace = 1;
}

message WorkflowInfo {
  string name = 1;
  string version = 2;
  string description = 3;
}

message WorkflowListResponse {
  repeated WorkflowInfo workflows = 1;
}
