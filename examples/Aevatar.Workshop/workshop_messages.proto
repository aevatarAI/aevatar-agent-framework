syntax = "proto3";

package aevatar.workshop;

option csharp_namespace = "Aevatar.Workshop.Messages";

// Ping event to demonstrate [EventHandler] and YAML module handling.
message WorkshopPingEvent {
  string request_id = 1;
  string content = 2;
  int64 timestamp = 3;
}

// Pong response emitted by handlers/modules.
message WorkshopPongEvent {
  string request_id = 1;
  string content = 2;
  int64 timestamp = 3;
}
